name: IUT v4.3 admissible-prime/orbicurve inhabitation

on:
  push:
    branches:
      - iut-v30-actual-types
    paths:
      - 'iut-v43-inhabitation/**'
      - '.github/workflows/iut-v43-inhabitation.yml'
  pull_request:
    paths:
      - 'iut-v43-inhabitation/**'
      - '.github/workflows/iut-v43-inhabitation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and build
        working-directory: iut-v43-inhabitation
        shell: bash
        run: |
          lake update
          lake build
      - name: Reject placeholders
        shell: bash
        run: |
          if grep -RInE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' \
              iut-v43-inhabitation/IUTInhabitation; then
            echo 'Found a prohibited proof placeholder declaration.'
            exit 1
          fi
      - name: Upload source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iut-v43-inhabitation-source
          path: iut-v43-inhabitation
          if-no-files-found: error
