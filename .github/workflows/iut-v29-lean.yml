name: IUT v2.9 Lean check

on:
  push:
    branches:
      - iut-v29-lean-ci
    paths:
      - 'iut-v29/**'
      - '.github/workflows/iut-v29-lean.yml'
  pull_request:
    paths:
      - 'iut-v29/**'
      - '.github/workflows/iut-v29-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib and build
        working-directory: iut-v29
        shell: bash
        run: |
          lake update
          lake exe cache get
          lake build --wfail
      - name: Reject placeholders
        shell: bash
        run: |
          if grep -RInE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' \
              iut-v29/IUTSourceShape; then
            exit 1
          fi
